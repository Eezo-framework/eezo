name: Release

# A release is a tag and nothing else. `bin/release <version>`, run on dev, bumps the version
# literals, fast forwards main to that commit and pushes the tag; this workflow does the rest.
# sbt-ci-release reads the version off the tag through sbt-dynver, signs every module and pushes
# the bundle to Sonatype Central. The site then deploys from the same commit, and only once the
# publish has succeeded, so eezo.io never documents a version that is not on Maven Central.
# Pushing to any other ref publishes nothing, so this workflow only ever fires on `v*`.
#
# The manual trigger redeploys the site alone, for a docs fix that is not worth a release. It
# runs from main, which is always the latest release, and refuses any other branch: the site
# serves the repository's own Markdown, so a deploy from dev would document unreleased work.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Sonatype Central
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # sbt-dynver reads the tag out of the git history, so a shallow clone would leave it with
      # no version to derive.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Before anything leaves this runner: every place that names the release, the install
      # snippets and the site's pin, must name this tag. A tag that fails here costs a deleted
      # tag and nothing else, because nothing has reached Sonatype yet.
      - name: Check the version literals
        run: bin/release --check "${GITHUB_REF_NAME#v}"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt -batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  site:
    name: Deploy the site
    needs: publish
    # After a successful publish on a tag; or alone on the manual trigger, where publish is skipped.
    if: ${{ !cancelled() && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest

    # One deploy at a time, in order. A cancelled deploy is a half applied one, so later ones wait.
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    steps:
      - name: Refuse to deploy from anything but the latest release
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::the site deploys from main or a release tag, not from ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up the Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # The site pins the released eezo and resolves it from Maven Central, and Sonatype Central
      # takes a while to sync a fresh release there. `publishLocal` first puts the same modules,
      # built from the same commit, in the local ivy cache, which sbt consults before Maven
      # Central, so the deploy neither waits on the sync nor fails for want of it. `unidoc`
      # writes the API reference the site serves under /api.
      - name: Publish eezo locally and generate the API docs
        run: sbt -batch publishLocal unidoc

      # `bin/eezo deploy` stages the jars and a Dockerfile, hands them to Fly's remote builder,
      # and waits for `/eezo/health`. `fly.toml` is committed, so this is never a first deploy and
      # nothing is created; the token is a deploy token scoped to the one app.
      - name: Deploy
        run: cd site && ../bin/eezo deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
