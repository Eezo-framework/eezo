# The shop's own values, read into shop.ShopConfig before the shop starts. Each one comes from the
# variable the README names for it, so no secret is ever written here.

stripe {
  secretKey = ${?STRIPE_SECRET_KEY}
  webhookSecret = ${?STRIPE_WEBHOOK_SECRET}
}

# Unset on a laptop, where the class's default, http://localhost:8080, applies.
shopUrl = ${?SHOP_URL}

# Read by CreateUser alone. Unset them before the server starts: it has no use for either.
createUser {
  email = ${?SHOP_EMAIL}
  password = ${?SHOP_PASSWORD}
}
