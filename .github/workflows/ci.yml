name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        jdk: [25, 26]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt -batch compile Test/compile

      # The JDK floor is a design constraint, not a preference: JEP 491 removed virtual thread
      # pinning on `synchronized`, and research/http-server.md measured a 16x latency degradation
      # on JDK 21. `Global / onLoad` in the sbt build fails the load on a JVM below the floor, so a
      # bad JDK is caught before any task runs. ToolchainSuite then asserts the Scala version, the
      # floor and that `-release 25` really reached the bytecode, all from inside the compiled
      # code, so no separate shell check is needed here. The JDK 26 leg is the only configuration
      # in which that bytecode assertion can actually fail, since the JDK 25 leg would stamp class
      # file major 69 with or without `-release 25` reaching the compiler.
      - name: Test (JDK ${{ matrix.jdk }})
        run: sbt -batch test
