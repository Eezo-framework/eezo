name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main is the latest release and moves only by fast forward when `bin/release` tags one, so a
  # pull request can only ever target dev. This job exists to say so where the author looks.
  base:
    name: Pull requests target dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::main is the latest release; change the base of this pull request to dev"
          exit 1

  build:
    name: Compile and test
    runs-on: ubuntu-latest
    # A green run takes about 6 minutes, so 25 leaves room for a cold cache or a slow runner
    # without letting a hang run on. The default is 360, and a hung suite once held the Test step
    # for 5 hours 23 minutes before anyone cancelled it, blocking the branch status all the while.
    # Hitting this limit ends the job red, which is the point: a hang costs minutes, not hours.
    timeout-minutes: 25

    steps:
      # The whole history, tags included, so that sbt-dynver derives the same version here as the
      # release workflow does. On the commit a release tags, that is the release version itself,
      # and the site step below needs it to be: a shallow clone has no tag to describe, so that
      # commit would be versioned by its hash and the site would still look for the release on
      # Maven Central, where it is not yet.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Formatting is checked before compiling, so a badly formatted tree fails in seconds rather
      # than after the build.
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

      # Prose in docs and scaladoc carries no dash characters. The script lists each offender as
      # file:line and exits 1, so a stray dash fails here, in seconds, before the build starts.
      - name: Check prose
        run: bin/prose-check

      # `+compile` rather than `compile`, and the `+` is there for the sbt plugin alone. `sbt-eezo`
      # is built from one source set on two axes, Scala 2.12 with sbt 1 and Scala 3.8.4 with sbt 2,
      # and no compiler flag enforces the shared subset that requires: `-Xsource:3` on the 2.12 axis
      # accepts Scala 3 syntax but does not reject Scala 2 syntax, and it does not reconcile Scala
      # 3's leading infix rule, so a file can compile clean on 2.12 and still fail, or quietly mean
      # something else, on 3.8.4. Compiling both axes is the only guard there is. Doing it here
      # rather than leaving it to `+publishSigned` inside `ci-release` means a divergence costs a red
      # build; on a tag it costs the release, which aborts only after the tag exists and so needs a
      # fresh one.
      #
      # The cross is cheap because `crossScalaVersions` is per project: sbt reports "Setting Scala
      # version to 2.12.21 on 1 projects. Excluded 9 projects", then "Setting Scala version to
      # 3.8.4 on 10 projects", so only the plugin is built twice and the eight framework modules
      # are not dragged through a 2.12 pass they would never survive.
      - name: Compile
        run: sbt -batch +compile Test/compile

      # The JDK floor is a design constraint, not a preference: JEP 491 removed virtual thread
      # pinning on `synchronized`, and research/http-server.md measured a 16x latency degradation
      # on JDK 21. `Global / onLoad` in the sbt build fails the load on a JVM below the floor, so a
      # bad JDK is caught before any task runs, on this runner and on a contributor's machine
      # alike. No separate shell check is needed here.
      #
      # `+test` for the same reason `+compile` is crossed: the sbt plugin's own suite has to run on
      # both axes, since a semantic divergence between Scala 2.12 and 3.8.4 compiles clean on each.
      # The framework modules are built once, because `crossScalaVersions` is per project.
      #
      # The `db` suite starts a real Postgres through testcontainers, which needs a Docker daemon.
      # ubuntu-latest runners have one; a self-hosted runner without it will fail here rather than
      # skip, which is deliberate — half of what `db` claims is a claim about Postgres, and a run
      # that silently skipped those suites would be reporting on the other half only.
      #
      # BacklogSuite is expected to pass while printing one warning per open item in
      # design/backlog.md. If it *fails*, an item has been fixed: the message says what to do.
      - name: Test
        run: sbt -batch +test

      # The walking skeletons, built the way a user builds one: eezo published to the local ivy
      # cache, and a separate sbt build that enables the plugin and compiles what it generates.
      # Nothing inside this repository exercises the plugin end to end, because a plugin defined in
      # a build cannot be enabled by that same build. `blog` is what covers the derived half: its
      # seven routes exist only in the file the generator writes.
      - name: Build the example applications
        run: |
          sbt -batch publishLocalForExample
          cd examples && sbt -batch scalafmtCheckAll test

      # The documentation site is an eezo application too, with a build of its own against the
      # released eezo, the way a user's application is built. Its suite renders every page out of
      # the repository's Markdown and follows every link, so a doc edit that breaks a cross
      # reference, or a new file no section lists, fails here rather than on eezo.io. The API
      # reference it serves is the scaladoc `unidoc` writes at the root, so that runs first; under
      # `CI` the suite refuses a build without it.
      #
      # `publishLocal` first, as the release workflow does before it deploys the site. The site pins
      # a release, and on the commit that cuts it the pin names a version that is on its way to
      # Maven Central but not there yet: the release workflow is publishing it at the same moment
      # this runs. Published locally from the same commit, it sits in the ivy cache sbt consults
      # before Central, so the site builds against the code it documents rather than against a
      # resolution that will fail. On every other commit the version published locally is not the
      # one pinned, nothing in the cache matches, and the site resolves the release from Central as
      # a user's build would.
      - name: Build the documentation site
        run: |
          sbt -batch publishLocal unidoc
          cd site && sbt -batch scalafmtCheckAll compile test
