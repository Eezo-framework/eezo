# The shop's file, as an application writes it: a literal where the value is the same everywhere,
# a substitution where the environment decides, and a literal a substitution may replace.
port = 8080
stripe {
  secretKey     = ${?STRIPE_SECRET_KEY}
  webhookSecret = ${?STRIPE_WEBHOOK_SECRET}
}
shopUrl = "http://localhost:8080"
shopUrl = ${?SHOP_URL}
