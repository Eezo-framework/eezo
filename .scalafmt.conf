version = 3.11.1
runner.dialect = scala3
align.preset = more
maxColumn = 100

# Capture checking is enabled on the `db` module (DESIGN §8.8), and scalameta — which scalafmt
# parses with — does not understand its syntax: `type DB = DBCap^` and `Tx ?-> A` are parse errors,
# not formatting differences. CI runs `scalafmtCheckAll` before compiling, so these files have to be
# excluded or the build reds before it ever reaches the compiler.
#
# Keep this list as short as the capture annotations allow: everything else in `db` is still
# formatted. Revisit whenever scalafmt gains capture-checking support.
project.excludeFilters = [
  "modules/db/src/main/scala/io/eezo/db/capability/Capability.scala",
  "modules/db/src/main/scala/io/eezo/db/engine/Run.scala",
  "modules/db/src/main/scala/io/eezo/db/engine/Pool.scala",
  "modules/db/src/main/scala/io/eezo/db/Scopes.scala",
  "modules/db/src/main/scala/io/eezo/db/Column.scala"
]
