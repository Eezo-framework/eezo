name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Formatting is checked before compiling, so a badly formatted tree fails in seconds rather
      # than after the build.
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

      - name: Compile
        run: sbt -batch compile Test/compile

      # The JDK floor is a design constraint, not a preference: JEP 491 removed virtual thread
      # pinning on `synchronized`, and research/http-server.md measured a 16x latency degradation
      # on JDK 21. `Global / onLoad` in the sbt build fails the load on a JVM below the floor, so a
      # bad JDK is caught before any task runs. ToolchainSuite then asserts the Scala version, the
      # floor and that `-release 25` really reached the bytecode, all from inside the compiled
      # code, so no separate shell check is needed here. Note that the bytecode half of that
      # assertion cannot fail on this runner: JDK 25 stamps class file major 69 with or without
      # `-release 25` reaching the compiler. It only discriminates when the build JVM sits above
      # the floor, which is where a contributor on a newer JDK will catch it.
      - name: Test
        run: sbt -batch test
