# Generated by eezo deploy. Yours to edit; eezo rewrites it only if you delete it.
app = 'eezo-shop'
primary_region = 'fra'

[deploy]
  # Runs in a one-off machine with the NEW image, before any app machine is updated. A nonzero
  # exit stops the deployment and the old version keeps serving — this is eezo's migration
  # ordering: the schema converges before new code takes traffic.
  release_command = 'migrate --apply'

[http_service]
  # Must match the app's `port` (EezoApp default: 8080).
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 1, not eezo's 0: the sales board is a live component over a WebSocket, and an idle stopped
  # machine would close every open board (docs/live.md §8).
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/eezo/health'

# Not written by eezo deploy, whose fly.toml carries no vm section, so the machine gets Fly's
# default of 256MB. A JVM serving a room full of phones gets the 1GB `fly launch` proposed.
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
